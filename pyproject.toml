[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-gateway"
version = "0.2.0"
description = "MCP Agent Gateway: deterministic direct-mode tools (filesystem, search, process, git) for ChatGPT, with optional OpenCode agent delegation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2,<3",
    "httpx>=0.27",
    "pydantic>=2",
    "python-dotenv>=1",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
]

[project.scripts]
agent-gateway = "agent_gateway.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires a live OpenCode server",
    "e2e: full gateway end-to-end test",
    "opencode: requires ENABLE_OPENCODE_AGENT=true and a live OpenCode server",
]